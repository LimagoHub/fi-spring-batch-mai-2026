# Test-Properties überschreiben die main application.properties vollständig.
# Kein spring.profiles.active=h2 → application-h2.properties wird NICHT geladen.
# Stattdessen: In-Memory-H2, damit Tests isoliert laufen und keine Datei hinterlassen.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

logging.level.root=WARN
logging.level.org.springframework.batch=INFO
logging.level.de.fi.tag2_07partitionierer=DEBUG
spring.main.banner-mode=off
